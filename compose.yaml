name: tdtu-conduct-demo
services:
  app:
    build:
      context: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      BASE_URL: http://localhost:3000
      DATA_DIR: /app/data
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      GOOGLE_AUTH_AUDIENCE: ${GOOGLE_AUTH_AUDIENCE:-internal}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-student.tdtu.edu.vn,tdtu.edu.vn}
      ALLOWED_HOSTED_DOMAINS: ${ALLOWED_HOSTED_DOMAINS:-student.tdtu.edu.vn,tdtu.edu.vn}
      LECTURER_EMAILS: ${LECTURER_EMAILS-523h0025@student.tdtu.edu.vn}
      COORDINATOR_EMAILS: ${COORDINATOR_EMAILS:-}
    volumes:
      - conduct-data:/app/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  conduct-data:
